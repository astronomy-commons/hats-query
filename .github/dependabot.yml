version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # Crates which must be updated together
      datafusion-and-friends:
        patterns:
          - "datafusion"
          - "arrow"
          - "arrow-*"
          - "pyo3"
          - "pyo3-*"
