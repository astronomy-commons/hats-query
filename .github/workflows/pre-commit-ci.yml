
# This workflow runs pre-commit hooks on pushes and pull requests to main
# to enforce coding style. To ensure correct configuration, please refer to:
#  https://lincc-ppt.readthedocs.io/en/latest/practices/ci_precommit.html
name: Run pre-commit hooks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  pre-commit-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install uv and Python
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        python-version: '3.15'
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: "${{ runner.os }}_debug"
    - name: Install dependencies
      run: |
        sudo apt-get update
        uv sync --locked --only-group dev
    - name: Run pre-commit
      run: |
        uv run pre-commit run --all-files --verbose --show-diff-on-failure
      env:
        # The hooks don't need the hats-query package, don't let their `uv run` build it
        UV_NO_SYNC: "1"
        SKIP: "check-lincc-frameworks-template-version,no-commit-to-branch,check-added-large-files,validate-pyproject,sphinx-build,pytest-check"
    - uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc  # v1.2.0
      if: failure() && github.event_name == 'pull_request' && github.event.pull_request.draft == false
