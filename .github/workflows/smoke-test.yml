# This workflow will run daily at 06:45.
# It will install Python dependencies and run tests with a variety of Python versions.
# See documentation for help debugging smoke test issues:
#    https://lincc-ppt.readthedocs.io/en/latest/practices/ci_testing.html#version-culprit

name: Unit test smoke test

on:

  # Runs this workflow automatically
  schedule:
    - cron: 45 6 * * *

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

env:
  # Display full backtrace for rust panic
  RUST_BACKTRACE: 1

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        submodules: true
    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: "${{ runner.os }}_debug"
    - name: Install STILTS
      run: |
        curl -fsSL -o ~/stilts.jar https://www.star.bris.ac.uk/~mbt/stilts/stilts.jar
        echo "STILTS=java -jar $HOME/stilts.jar" >> "$GITHUB_ENV"
    - name: Install the latest versions of dependencies, ignoring uv.lock
      run: |
        sudo apt-get update
        uv sync --upgrade --all-packages --no-default-groups --group test
    - name: Run cargo clippy
      run: |
        cargo clippy --all-targets -- -D warnings
    - name: Run cargo test
      run: |
        cargo test
    - name: List dependencies
      run: |
        uv pip list
    - name: Run unit and integration tests with pytest
      run: |
        uv run --no-sync pytest -o log_cli=true -vv -m ""
