
# .readthedocs.yml
# Read the Docs configuration file
# See  https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
    rust: "latest"
  # Install the uv workspace, see https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-uv
  # The Rust extension is built in debug mode, see the root pyproject.toml
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --all-packages

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/conf.py
