
# .readthedocs.yml
# Read the Docs configuration file
# See  https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"  # Must match .python-version
    rust: "latest"

# See https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-uv
# The Rust extension is built in debug mode, see the root pyproject.toml
python:
  install:
    - method: uv
      command: sync
      groups: [docs]

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/conf.py
