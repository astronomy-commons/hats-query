[workspace]
members = ["hats-query", "hats-query-core", "hats-query-python"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/astronomy-commons/hats-query"

[workspace.dependencies]
approx = { version = "0.5", default-features = false }
# Must match the "arrow" version used by datafusion
arrow-pyarrow = "59"
async-trait = "0.1"
bytes = "1"
datafusion = { version = "55", default-features = false, features = ["compression", "parquet", "sql"] }
# Must match the "futures" version used by datafusion
futures-util = "0.3"
hats-query-core = { path = "hats-query-core", version = "0.0.0" }
java-properties = "2"
itertools = { version = "0.15", default-features = false, features = ["use_std"] }
moka = { version = "0.12", default-features = false, features = ["future"]  }
# Must use the same "object_store" version as datafusion
object_store_opendal = { version = "0.58" , default-features = false }
# Must match the "opendal" version used by object_store_opendal
opendal = { version = "0.58", default-features = false, features = ["services-fs"] }
# Crate version must match to the version used by arrow-pyarrow. ABI3 version should match the minimum supported Python
# version and must be kept in sync with CIBW_BUILD in .github/workflows/publish-to-pypi.yml.
pyo3 = { version = "0.29", features = ["abi3-py311", "bytes"] }
# Must match pyo3 version
pyo3-async-runtimes = { version = "0.29", features = ["attributes", "tokio-runtime"] }
roxmltree = { version = "0.21", default-features = false }
tokio = { version = "1", default-features = false }
url = "2"
# votable 0.7.0 doesn't build with serde 1.0.229+ because it uses serde private API, and upstream main pins serde.
# Our fork removes the private API usage and the pin, switch back to a release version once
# https://github.com/cds-astro/cds-votable-rust/pull/15 is merged and released.
votable = { git = "https://github.com/lincc-frameworks/cds-votable-rust.git", branch = "rm-serde-pin", default-features = false }

[workspace.lints.rust]
redundant_imports = "warn"
