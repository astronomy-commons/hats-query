[package]
name = "hats-query"
version = "0.0.0"
edition = "2024"

[lib]
name = "_extension"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
# Must match the "arrow" version used by datafusion
arrow-pyarrow = "59"
bytes = "1"
datafusion = { version = "55", default-features = false, features = ["compression", "parquet", "sql"] }
# Must match the "futures" version used by datafusion
futures-util = "0.3"
java-properties = "2"
itertools = { version = "0.15", default-features = false }
moka = { version = "0.12", default-features = false, features = ["future"]  }
# Must use the same "object_store" version as datafusion
object_store_opendal = { version = "0.58" , default-features = false }
# Must match the "opendal" version used by object_store_opendal
opendal = { version = "0.58", default-features = false, features = ["services-fs"] }
# Crate version must match to the version used by arrow-pyarrow. ABI3 version should match the minimum supported Python
# version and must be kept in sync with [tool.distutils.bdist_wheel] py-limited-api in pyproject.toml and CIBW_BUILD in
# .github/workflows/publish-to-pypi.yml.
pyo3 = { version = "0.29", features = ["abi3-py311", "bytes"] }
# Must match pyo3 version
pyo3-async-runtimes = { version = "0.29", features = ["attributes", "tokio-runtime"] }
tokio = { version = "1", default-features = false }

[lints.rust]
redundant_imports = "warn"

[dev-dependencies]
approx = { version = "0.5", default-features = false }
roxmltree = { version = "0.21", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros"] }