# Integration tests of the hats-query server, a member of the uv workspace in the repository root.
# This is not a package, uv only installs its dependencies. The server is built and installed independently,
# for now the tests run the Python server from the hats-query package of ../hats-query-python.
# Pytest settings are in the root pyproject.toml.

[project]
name = "hats-query-tests"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "httpx2", # Used by fastapi.testclient.TestClient
    "pytest",
    "pytest-asyncio",
    "pytest-cov", # Used to report total code coverage
    "pyvo",
    "xmlschema", # Validates responses against IVOA XML schemas
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
    ]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]
[tool.ruff.lint.isort]
# The package under test
known-first-party = ["hats_query"]
