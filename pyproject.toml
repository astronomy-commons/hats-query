# uv workspace of the Python projects, it is not a package itself.
# Set up the development environment with `uv sync --all-packages --all-groups`.

[tool.uv.workspace]
members = ["hats-query-python", "hats-query-tests"]

[tool.uv]
# Build the Rust extension in debug mode for the development environment.
# Release wheels are built by cibuildwheel, which doesn't use this setting.
config-settings-package = { hats-query = { "maturin.build-args" = "--profile dev" } }

[tool.uv.sources]
hats-query = { workspace = true }

[dependency-groups]
dev = [
    { include-group = "docs" },
    "jupyter", # Clears output from Jupyter notebooks
    "maturin", # Rebuilds the Rust extension with `uv run maturin develop --uv`, showing Cargo's output
    "pre-commit", # Used to run checks before finalizing a git commit
    "ruff", # Used for static linting of files
]
# Read the Docs installs this group only
docs = [
    "hats-query",
    "ipykernel",
    "ipython",
    "jupytext",
    "nbconvert",
    "nbsphinx",
    "sphinx",
    "sphinx-autoapi",
    "sphinx-copybutton",
    "sphinx-rtd-theme>=3.1.0",
]

# Single pytest configuration for all Python tests: run `uv sync --all-packages --all-groups && uv run pytest`
[tool.pytest.ini_options]
testpaths = [
    "hats-query-python/tests",
    "hats-query-python/python",
    "hats-query-tests/tests",
]
# Run STILTS tests with `-m ""`
addopts = "--import-mode=importlib --doctest-modules -m 'not stilts'"
markers = [
    "stilts: needs STILTS, deselected by default",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli_level = "INFO"
