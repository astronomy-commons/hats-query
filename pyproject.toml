[project]
name = "hats-query"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "LINCC Frameworks", email = "lincc-frameworks-team@lists.lsst.org" }
]
description = "Server for querying HATS catalogs through VO and HTTP."
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "jinja2",
    # Minimum version supported by arrow-pyarrow crate
    # https://github.com/apache/arrow-rs/blob/55.0.0/.github/workflows/integration.yml
    "pyarrow >= 15",
]

[project.urls]
"Source Code" = "https://github.com/astronomy-commons/hats-query"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
dev = [
    "httpx2", # Used by fastapi.testclient.TestClient
    "jupyter", # Clears output from Jupyter notebooks
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-asyncio", # Runs async tests
    "pytest-cov", # Used to report total code coverage
    "ruff", # Used for static linting of files
    "uvicorn", # Runs the development server
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools-rust>=1.12", # Used to build Rust extensions
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"hats_query.server" = ["templates/*.html"]

[[tool.setuptools-rust.ext-modules]]
target = "hats_query._extension"
py-limited-api = true

# Must match pyo3's "abi3-pyXY" feature in Cargo.toml
[tool.distutils.bdist_wheel]
py-limited-api = "cp311"

[tool.setuptools_scm]
write_to = "src/hats_query/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests/hats_query",
    "src",
    "docs",
]
addopts = "--doctest-modules --doctest-glob=*.rst --ignore=tests/data/lyonetia"
asyncio_mode = "auto"
log_cli_level = "INFO"

[tool.ruff]
line-length = 110
extend-exclude = ["tests/data/lyonetia"]
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
    ]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]


[tool.coverage.run]
omit=["src/hats_query/_version.py"]
